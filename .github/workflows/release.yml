name: release

# Automated release pipeline.
#
# release-please (job 1, push-to-main only) reads Conventional Commit messages,
# maintains a "release PR", and — when that PR is merged — creates the git tag
# vX.Y.Z + GitHub Release. Job 2 then cross-compiles the CLI with GoReleaser
# (--skip=publish), keyless-signs checksums.txt with cosign, and attaches the
# binaries + checksums.txt + signature bundle to the release.
#
# Job 2 also runs on manual dispatch (workflow_dispatch with a `tag` input) so
# the artifacts for an existing tag can be (re)built — e.g. recovering a release
# whose build failed, or re-signing after a signing-config change.
#
# release-please's extra-files version-bump does not fire for this repo's file
# types (shell/markdown), so job 3 deterministically syncs the version pin in
# the skill installer + SKILL.md to the just-released tag.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build + sign assets for, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please (release PR + tag + release)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4

  release-assets:
    name: build + sign + attach
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build cross-platform binaries (GoReleaser, no publish)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: ~> v2
          # Build artifacts only; the GitHub Release is owned by release-please.
          # We attach the binaries + checksums.txt + signature ourselves below.
          args: release --clean --skip=publish

      - name: Flatten binaries to publish names + upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GoReleaser's binary archive format leaves each platform's binary in a
          # per-target subdir (dist/linkedin-jobs_<os>_<arch>_<v>/) but lists the
          # flat publish name in checksums.txt. Copy each binary to its publish
          # name so the file set matches checksums.txt, then upload.
          while read -r sha f; do
            base="${f%.exe}"
            bin="linkedin-jobs"
            case "$f" in *.exe) bin="linkedin-jobs.exe";; esac
            cp "dist/${base}"_*/"$bin" "dist/$f"
          done < dist/checksums.txt

          files=""
          while read -r sha f; do files="$files dist/$f"; done < dist/checksums.txt
          gh release upload "$TAG" $files dist/checksums.txt dist/checksums.txt.sigstore.json --clobber

      - name: Summary
        run: |
          echo "### Released ${{ env.TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Attached binaries + checksums.txt (cosign-signed):" >> "$GITHUB_STEP_SUMMARY"
          awk '{print "- `" $2 "`"}' dist/checksums.txt >> "$GITHUB_STEP_SUMMARY"
          echo "- \`checksums.txt\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`checksums.txt.sigstore.json\` (cosign keyless bundle)" >> "$GITHUB_STEP_SUMMARY"

  sync-version-pin:
    name: sync installer/SKILL version pin
    needs: [release-please, release-assets]
    # only on a real release whose assets built successfully (not on dispatch)
    if: ${{ always() && needs.release-please.outputs.releases_created == 'true' && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Bump the version pin to ${{ needs.release-please.outputs.tag_name }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          new="${TAG#v}"
          old=$(awk -F'"' '/^VERSION=/{print $2}' hermes-skill/scripts/install-cli.sh)
          if [ "$old" = "$new" ]; then
            echo "pin already at $new; nothing to do"
            exit 0
          fi
          sed -i "s/^VERSION=\"${old}\"/VERSION=\"${new}\"/" hermes-skill/scripts/install-cli.sh
          sed -i "s/^version: ${old}$/version: ${new}/" hermes-skill/SKILL.md
          sed -i "s/LJ_VERSION=${old}/LJ_VERSION=${new}/" hermes-skill/SKILL.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): sync installer/SKILL pin to ${new}"
          git push
